<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-6">
    <h3 class="mb-3">Register</h3>
    <div class="text-danger mb-2" th:text="${error}"></div>
    <div class="text-success mb-2" th:text="${msg}"></div>

    <form method="post" th:object="${registerRequest}">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Full Name</label><input class="form-control" th:field="*{fullName}" required/>
        </div>
        <div class="col-md-6 mb-3">
          <label>Email</label><input class="form-control" th:field="*{email}" required/>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Password</label><input class="form-control" type="password" th:field="*{password}" required/>
        </div>
        <div class="col-md-6 mb-3">
          <label>Role</label>
          <select class="form-select" th:field="*{role}">
            <option value="CUSTOMER">Customer</option>
            <option value="STORE_OWNER">Store Owner</option>
          </select>
        </div>
      </div>
      <button class="btn btn-success" type="submit">Create account</button>
    </form>
  </div></div>
</div>
</body>
</html>
