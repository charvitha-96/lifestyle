<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${store.name}">Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-4">
  <h3 th:text="${store.name}">Store</h3>
  <p th:text="${store.address}"></p>

  <div class="mb-3">
    <a th:href="@{'/stores/' + ${store.id} + '?category=DRESS'}" class="btn btn-sm btn-outline-secondary">Dress</a>
    <a th:href="@{'/stores/' + ${store.id} + '?category=FOOTWEAR'}" class="btn btn-sm btn-outline-secondary">Footwear</a>
    <a th:href="@{'/stores/' + ${store.id} + '?category=JEWELLERY'}" class="btn btn-sm btn-outline-secondary">Jewellery</a>
  </div>

  <div class="row g-3">
    <div class="col-md-3" th:each="p : ${products}">
      <div class="card h-100">
        <img th:if="${p.imageUrl}" th:src="${p.imageUrl}" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title" th:text="${p.name}">Product</h5>
          <p class="card-text" th:text="${p.description}"></p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold" th:text="'₹' + ${p.price}"></span>
            <button class="btn btn-primary btn-sm"
                    th:attr="data-id=${p.id},data-price=${p.price}"
                    onclick="preorder(this)">Preorder</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Preorder Modal -->
<div class="modal" tabindex="-1" id="preModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Preorder</h5></div>
      <div class="modal-body">
        <div class="mb-3">
          <label>Quantity</label>
          <input type="number" id="qty" value="1" min="1" class="form-control"/>
        </div>
        <div class="mb-2">Advance (20%): <span id="adv">0</span></div>
        <div class="text-danger" id="err"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-success" onclick="payAdvance()">Pay Advance</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
let selectedProduct = null; let unitPrice = 0; let modal;
const sessionUserId = /*[[${userId}]]*/ null;

window.addEventListener('load', () => {
  modal = new bootstrap.Modal(document.getElementById('preModal'));
});

function preorder(btn){
  if(!sessionUserId){ alert('Please login first'); return; }
  selectedProduct = btn.getAttribute('data-id');
  unitPrice = parseFloat(btn.getAttribute('data-price'));
  document.getElementById('qty').value = 1;
  document.getElementById('adv').innerText = (unitPrice * 0.2).toFixed(2);
  document.getElementById('err').innerText = '';
  modal.show();
}

async function payAdvance(){
  const qty = parseInt(document.getElementById('qty').value||'1');
  try {
    let res = await fetch('/api/preorders', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({customerId: sessionUserId, productId: selectedProduct, quantity: qty})
    });
    if(!res.ok){ throw new Error('Create preorder failed'); }
    let preorder = await res.json();
    let res2 = await fetch(`/api/preorders/${preorder.id}/pay-advance`, {method:'POST'});
    if(!res2.ok){ throw new Error('Advance payment failed'); }
    modal.hide();
    alert('Advance paid and item reserved!');
  } catch(e) {
    document.getElementById('err').innerText = 'Failed to place preorder';
  }
}
</script>
</body>
</html>
