<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-4">
    <h3 class="mb-3">Login</h3>
    <div class="text-danger mb-2" th:text="${error}"></div>
    <form method="post" th:object="${loginRequest}">
      <div class="mb-3"><label>Email</label><input class="form-control" th:field="*{email}" required/></div>
      <div class="mb-3"><label>Password</label><input class="form-control" type="password" th:field="*{password}" required/></div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <div class="mt-3"><a href="/register">New user? Register</a
