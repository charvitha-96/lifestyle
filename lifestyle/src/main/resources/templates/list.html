<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Stores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-4">
  <h3>Nearby Stores</h3>
  <p>Click the button to fetch stores within 5 km of your location.</p>
  <button class="btn btn-primary mb-3" onclick="loadNearby()">Use my location</button>
  <div id="stores" class="row g-3"></div>
</div>

<script>
function loadNearby(){
  if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    const res = await fetch(`/api/stores/nearby?lat=${lat}&lon=${lon}&radiusKm=5`);
    const data = await res.json();
    const container = document.getElementById('stores');
    container.innerHTML = '';
    data.forEach(s => {
      const col = document.createElement('div'); col.className = 'col-md-4';
      col.innerHTML = `
        <div class='card h-100'>
          <div class='card-body'>
            <h5 class='card-title'>${s.name}</h5>
            <p class='card-text'>${s.address ?? ''}</p>
            <a class='btn btn-outline-primary' href='/stores/${s.id}'>View</a>
          </div>
        </div>`;
      container.appendChild(col);
    });
  }, _ => alert('Unable to get location'));
}
</script>
</body>
</html>
