<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Local Fashion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Local Fashion</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/stores">Browse Stores</a></li>
        <li class="nav-item" th:if="${userId == null}"><a class="nav-link" href="/login">Login</a></li>
        <li class="nav-item" th:if="${userId == null}"><a class="nav-link" href="/register">Register</a></li>
        <li class="nav-item" th:if="${userId != null}"><a class="nav-link" href="/logout">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="p-5 mb-4 bg-light rounded-3">
    <h1 class="display-5 fw-bold">Find fashion near you</h1>
    <p class="col-md-8 fs-4">Search local stores within 5 km, browse by category, and preorder by paying 20% advance.</p>
    <a class="btn btn-primary btn-lg" href="/stores">Browse Stores</a>
  </div>
</div>
</body>
</html>
